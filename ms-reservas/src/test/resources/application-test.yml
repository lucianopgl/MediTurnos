server:
  port: 0

spring:
  application:
    name: ms-reservas-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS schema_reservas
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: schema_reservas
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8083/realms/MediTurnos/protocol/openid-connect/certs

catalogo:
  base-url: http://localhost:8081/api/catalogo

notificaciones:
  api:
    url: https://api.telegram.org
    bot-token: dummy_token_desarrollo
