server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-catalogo-recursos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediturnos_db?currentSchema=schema_catalogo}
    username: ${DB_USERNAME:mediturnos_user}
    password: ${DB_PASSWORD:mediturnos_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: schema_catalogo
        format_sql: false
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8083/realms/MediTurnos/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
