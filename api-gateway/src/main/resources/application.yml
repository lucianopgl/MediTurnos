server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - utn.frc.backend.mediturnos.common.config.CommonLibAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8083/realms/MediTurnos/protocol/openid-connect/certs}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials X-Correlation-Id, RETAIN_FIRST
      routes:
        # Microservicio de Catálogo de Recursos (Puerto 8081)
        - id: ms-catalogo-recursos
          uri: ${CATALOGO_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/catalogo/**

        # Microservicio de Reservas y Turnos (Puerto 8082)
        - id: ms-reservas
          uri: ${RESERVAS_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/reservas/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
