server:
  port: 0

spring:
  application:
    name: api-gateway-test
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - utn.frc.backend.mediturnos.common.config.CommonLibAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/dummy-jwks

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 3s
      routes:
        - id: ms-catalogo-recursos
          uri: ${CATALOGO_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/catalogo/**

        - id: ms-reservas
          uri: ${RESERVAS_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/reservas/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
